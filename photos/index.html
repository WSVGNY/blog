    <script>
        
        
        
        const album = document.querySelector('.album');
        const counter = document.querySelector('.album-counter');
        const spreads = album.querySelectorAll('.spread');

        
        const wideLayout = window.matchMedia('(min-width: 700px)');

        
        function currentSpread() {
            return Math.round(album.scrollTop / album.clientHeight);
        }

        
        function goToSpread(number) {
            album.scrollTo({ top: number * album.clientHeight });
        }

        document.addEventListener('keydown', function (event) {
            const lightboxOpen = document.querySelector('.pswp--open') !== null;
            if (!wideLayout.matches || lightboxOpen) return;

            const key = event.key;
            const forward = key === 'ArrowDown' || key === 'ArrowRight' || key === ' ' || key === 'PageDown';
            const back = key === 'ArrowUp' || key === 'ArrowLeft' || key === 'PageUp';

            if (forward) goToSpread(currentSpread() + 1);
            else if (back) goToSpread(currentSpread() - 1);
            else if (key === 'Home') goToSpread(0);
            else if (key === 'End') goToSpread(spreads.length - 1);
            else return;

            event.preventDefault();
        });

        function updateCounter() {
            const number = currentSpread();
            const chapter = spreads[number].dataset.chapter; 
            const position = (number + 1) + ' / ' + spreads.length;
            counter.textContent = chapter ? chapter + ' · ' + position : position;
        }

        album.addEventListener('scroll', updateCounter, { passive: true });
        updateCounter();
    </script>
