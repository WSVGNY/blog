<head>
    <!-- Basic Page Needs
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <meta charset="utf-8">
    <title>{{ site.Title }}</title>
    <meta name="description" content="Pictures">
    <meta name="author" content="William Sevigny">

    <!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link rel="stylesheet" href="/normalize.css">
    <link rel="stylesheet" href="/skeleton.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/x-icon" href="/website_v2_no_back.ico">

    <!-- Libraries
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.css" />
    <link rel="stylesheet" href="/photoswipe-style-override.css" />

    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';

        // A desktop-size screen is 550px wide or more; narrower is phone-size.
        const desktopSize = window.matchMedia('(min-width: 550px)');

        const lightbox = new PhotoSwipeLightbox({
            gallery: '.pswp-gallery',
            children: 'a',
            showAnimationDuration: 200,
            hideAnimationDuration: 200,
            imageClickAction: 'close',
            tapAction: 'zoom',
            doubleTapAction: false,
            bgClickAction: 'close',
            // On a desktop-size screen, 75px arrows show at the sides, and
            // pictures keep clear of them.
            paddingFn: () => {
                const side = desktopSize.matches ? 80 : 10;
                return { top: 20, bottom: 20, left: side, right: side };
            },
            pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.min.js')
        });

        // On a desktop-size screen, dragging doesn't move the picture; the
        // arrows and keys change it. On a phone-size screen, swiping does.
        lightbox.on('pointerMove', (event) => {
            if (desktopSize.matches) event.preventDefault();
        });

        // While a big picture loads, its small picture shows in its place,
        // stretched, for every picture and not only the one first opened.
        lightbox.addFilter('placeholderSrc', (placeholderSrc, content) => content.data.msrc);

        lightbox.init();
    </script>

    <!-- Fonts
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
