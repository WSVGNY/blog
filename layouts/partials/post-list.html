<div>
    <p style="font-style: italic;">
        WILLIAMSEVIGNY.COM
    </p>
    <ul class="post-list">
        {{ range (where .Site.RegularPages.ByDate.Reverse "Type" "posts") }}
        <!-- Posts with an `album` live in that album instead of the list. -->
        {{ if not .Params.album }}
        <li class="post-list-item">
            <span style="text-transform: uppercase;">
                {{ .Title }}
            </span>
            <a href="{{ .Permalink }}">
                » click here
            </a>
        </li>
        {{ end }}
        {{ end }}
        {{ range .Site.RegularPages.ByTitle }}
        {{ if eq .Layout "album" }}
        <li class="post-list-item">
            <span style="text-transform: uppercase;">
                {{ .Title }}
            </span>
            <a href="{{ .Permalink }}">
                » click here
            </a>
        </li>
        {{ end }}
        {{ end }}
    </ul>
</div>
