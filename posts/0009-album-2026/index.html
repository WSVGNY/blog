    <script type="module">
        import PhotoSwipeLightbox from 'https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';

        
        const desktopSize = window.matchMedia('(min-width: 550px)');

        const lightbox = new PhotoSwipeLightbox({
            gallery: '.pswp-gallery',
            children: 'a',
            showAnimationDuration: 200,
            hideAnimationDuration: 200,
            imageClickAction: 'close',
            tapAction: 'zoom',
            doubleTapAction: false,
            bgClickAction: 'close',
            
            
            paddingFn: () => {
                const side = desktopSize.matches ? 80 : 10;
                return { top: 20, bottom: 20, left: side, right: side };
            },
            pswpModule: () => import('https://cdn.jsdelivr.net/npm/photoswipe@5/dist/photoswipe.esm.min.js')
        });

        
        
        lightbox.on('pointerMove', (event) => {
            if (desktopSize.matches) event.preventDefault();
        });

        
        
        lightbox.addFilter('placeholderSrc', (placeholderSrc, content) => content.data.msrc);

        lightbox.init();
    </script>
